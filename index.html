function docCategoryMeta(catId) {
  return DOC_CATEGORIES.find(c => c.id === catId);
}

function docCategoryLabel(catId) {
  return docCategoryMeta(catId)?.label || catId;
}

function docCount(catId) {
  const data = userSettings.documents[catId];
  if (!data) return 0;
  if (Array.isArray(data)) return data.length;
  if (typeof data === "object" && data !== null) {
    // Single-record category: count is 1 if any field has data
    return Object.values(data).some(v => v !== null && v !== "") ? 1 : 0;
  }
  if (typeof data === "string") return data ? 1 : 0;
  return 0;
}

function docVaultSummary() {
  let total = 0;
  let expiringSoon = 0;
  const now = new Date();
  const sixMonths = new Date(now.getTime() + 180 * 86400000);

  for (const cat of DOC_CATEGORIES) {
    total += docCount(cat.id);
    // Check expiration on any document with an expiration field
    const data = userSettings.documents[cat.id];
    if (Array.isArray(data)) {
      for (const item of data) {
        const exp = item.expiration || item.validUntil;
        if (exp && new Date(exp) <= sixMonths && new Date(exp) >= now) expiringSoon++;
      }
    } else if (data && typeof data === "object") {
      const exp = data.expiration || data.validUntil;
      if (exp && new Date(exp) <= sixMonths && new Date(exp) >= now) expiringSoon++;
    }
  }

  if (total === 0) return "Add your first document";
  let summary = `${total} ${total === 1 ? 'document' : 'documents'} stored`;
  if (expiringSoon > 0) summary += ` · ${expiringSoon} expiring soon`;
  return summary;
}

// Returns "expired" | "expiring" | "ok" | null based on a date string
function docExpiryStatus(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return null;
  const now = new Date();
  if (d < now) return "expired";
  const sixMonths = new Date(now.getTime() + 180 * 86400000);
  if (d < sixMonths) return "expiring";
  return "ok";
}

function docDetailTitle(catId, docId) {
  const meta = docCategoryMeta(catId);
  const data = userSettings.documents[catId];
  if (!meta) return "";
  if (!meta.multi) return meta.label;
  const doc = (data || []).find(d => d.id === docId);
  if (!doc) return meta.label;
  // Use most identifying field
  return doc.country || doc.state || doc.vaccine || doc.medication || doc.allergen || doc.condition || doc.name || meta.label;
}

/* ===== HUB: list of categories ===== */

function documentsHubBody() {
  const groups = DOC_GROUPS.map(group => {
    const cats = DOC_CATEGORIES.filter(c => c.group === group.id);
    const rows = cats.map(cat => {
      const count = docCount(cat.id);
      let summary;
      if (cat.id === "bloodType") {
        summary = userSettings.documents.bloodType || "Not set";
      } else if (count === 0) {
        summary = "None added";
      } else {
        summary = `${count} ${count === 1 ? 'item' : 'items'}`;
      }
      return `
        <div class="settings-row" onclick="gotoDocCategory('${cat.id}')">
          <div class="settings-row-icon">${cat.icon}</div>
          <div class="settings-row-text">
            <div>${cat.label}</div>
            <div class="settings-row-sub">${summary}</div>
          </div>
          <div class="settings-row-chevron">›</div>
        </div>
      `;
    }).join("");
    return `
      <div class="settings-section-label">${group.label}</div>
      <div class="settings-list">${rows}</div>
    `;
  }).join("");

  return `
    <div class="docs-intro">
      <div class="docs-intro-title">📄 Documents vault</div>
      <div class="docs-intro-text">
        Store passport, ID, and medical info securely. Photos and numbers stay on your device — we never share them with third parties.
        ${userSettings.maskSensitive ? '<br><br><strong style="color: var(--text-success);">🔒 Sensitive info is masked</strong> — values appear as ••••••• until tapped. Adjust in Settings → App lock.' : ''}
      </div>
    </div>
    ${groups}
  `;
}

/* ===== CATEGORY LIST: shows all docs in a category ===== */

function documentCategoryBody(catId) {
  const meta = docCategoryMeta(catId);
  if (!meta) return `<div class="sp-body">Unknown category.</div>`;

  // Special case: bloodType is just a string
  if (catId === "bloodType") {
    return bloodTypeEditorBody();
  }

  // Single-record category (Global Entry, TSA, Insurance): show editor inline
  if (!meta.multi) {
    return singleDocEditorBody(catId);
  }

  // Multi-record: list of cards + add button
  const data = effective("documents")[catId] || [];
  const items = data.map(doc => renderDocListItem(catId, doc)).join("");

  return `
    <div class="sp-body">
      ${data.length === 0 ? `
        <div class="docs-empty">
          <div class="docs-empty-icon">${meta.icon}</div>
          <div class="docs-empty-text">No ${meta.label.toLowerCase()} added yet.</div>
        </div>
      ` : `<div class="doc-list">${items}</div>`}
      ${app.editMode ? `
        <div class="doc-add" onclick="addDocument('${catId}')">
          + Add ${meta.label.toLowerCase().replace(/s$/, '').replace(/contacts$/, 'contact')}
        </div>
      ` : ''}
    </div>
  `;
}

function renderDocListItem(catId, doc) {
  // Build a "title" and "subtitle" for the card based on the category
  let title, subtitle, expiryStatus;
  if (catId === "passports") {
    title = doc.country ? `${doc.country} passport` : "Passport";
    subtitle = doc.fullName || doc.number || "";
    expiryStatus = docExpiryStatus(doc.expiration);
  } else if (catId === "driversLicenses") {
    title = doc.state ? `${doc.state} driver's license` : "Driver's license";
    subtitle = doc.fullName || doc.number || "";
    expiryStatus = docExpiryStatus(doc.expiration);
  } else if (catId === "visas") {
    title = doc.country ? `${doc.country} visa` : "Visa";
    subtitle = doc.type || "";
    expiryStatus = docExpiryStatus(doc.validUntil);
  } else if (catId === "vaccinations") {
    title = doc.vaccine || "Vaccination";
    const lastDose = doc.doses?.[doc.doses.length - 1];
    subtitle = lastDose ? `Latest: ${lastDose.date}` : "";
  } else if (catId === "prescriptions") {
    title = doc.medication || "Prescription";
    subtitle = doc.dosage || "";
  } else if (catId === "allergies") {
    title = doc.allergen || "Allergy";
    subtitle = doc.severity || "";
  } else if (catId === "medicalConditions") {
    title = doc.condition || "Condition";
    subtitle = doc.notes || "";
  } else if (catId === "emergencyContacts") {
    title = doc.name || "Contact";
    subtitle = doc.relationship || doc.phone || "";
  } else {
    title = "Document";
    subtitle = "";
  }

  const expiryBadge = expiryStatus === "expired"
    ? '<span class="doc-expiry-badge expired">Expired</span>'
    : expiryStatus === "expiring"
    ? '<span class="doc-expiry-badge expiring">Expiring soon</span>'
    : '';

  return `
    <div class="doc-card" onclick="gotoDocDetail('${catId}', '${doc.id}')">
      <div class="doc-card-body">
        <div class="doc-card-title">${title}</div>
        ${subtitle ? `<div class="doc-card-subtitle">${subtitle}</div>` : ''}
      </div>
      ${expiryBadge}
      <span class="doc-card-chevron">›</span>
    </div>
  `;
}

/* ===== DETAIL: single document edit form ===== */

function documentDetailBody(catId, docId) {
  const meta = docCategoryMeta(catId);
  if (!meta || !meta.multi) return documentCategoryBody(catId);
  const data = effective("documents")[catId] || [];
  const doc = data.find(d => d.id === docId);
  if (!doc) return `<div class="sp-body">Document not found.</div>`;

  return renderDocumentForm(catId, doc, meta.fields);
}

function singleDocEditorBody(catId) {
  const meta = docCategoryMeta(catId);
  if (!meta || meta.multi) return "";
  const doc = effective("documents")[catId] || {};
  return renderDocumentForm(catId, doc, meta.fields);
}

function renderDocumentForm(catId, doc, fields) {
  const meta = docCategoryMeta(catId);
  const isMulti = meta.multi;

  // Special handling for vaccinations (nested doses array)
  if (catId === "vaccinations") {
    return renderVaccinationForm(doc);
  }

  const fieldRows = fields.map(field => renderField(catId, doc, field)).join("");
  const photoSection = renderPhotoSection(catId, doc);

  return `
    <div class="sp-body">
      <div class="sp-section">
        ${fieldRows}
      </div>
      ${photoSection}
      ${isMulti && app.editMode ? `
        <div class="sp-section">
          <div class="sp-action-row danger" onclick="deleteDocument('${catId}', '${doc.id}')">
            <span class="sp-action-text">Delete this ${meta.label.toLowerCase().replace(/s$/, '').replace(/contacts$/, 'contact')}</span>
            <span class="sp-action-chevron">›</span>
          </div>
        </div>
      ` : ''}
    </div>
  `;
}

function renderField(catId, doc, fieldName) {
  const fieldMeta = FIELD_META[fieldName] || { label: fieldName, type: "text" };
  const value = doc[fieldName] || "";
  const inputId = `doc-field-${catId}-${doc.id || 'single'}-${fieldName}`;

  // Field types
  if (fieldMeta.type === "boolean") {
    return `
      <div class="sp-toggle-row ${app.editMode ? '' : 'readonly'}" onclick="toggleDocField('${catId}', ${attrJS(doc.id || '')}, '${fieldName}')">
        <div class="sp-toggle-info">
          <div class="sp-toggle-label">${fieldMeta.label}</div>
        </div>
        <div class="sp-toggle ${value ? 'on' : ''}"></div>
      </div>
    `;
  }

  if (fieldMeta.type === "select") {
    const options = (fieldMeta.options || []).map(o =>
      `<option ${value === o ? 'selected' : ''}>${o}</option>`
    ).join("");
    return `
      <div class="sp-field">
        <label class="sp-label">${fieldMeta.label}</label>
        <select class="sp-select" ${app.editMode ? '' : 'disabled'} onchange="setDocField('${catId}', ${attrJS(doc.id || '')}, '${fieldName}', this.value)">
          <option value=""></option>
          ${options}
        </select>
      </div>
    `;
  }

  // Sensitive fields get masking when not editing
  const masking = userSettings.maskSensitive && fieldMeta.sensitive && !app.editMode && value;
  const revealKey = `${catId}::${doc.id || 'single'}::${fieldName}`;
  const isRevealed = revealedFields.has(revealKey);
  const showMasked = masking && !isRevealed;
  const displayValue = showMasked ? "•".repeat(Math.max(value.length, 6)) : value;

  if (fieldMeta.type === "textarea") {
    return `
      <div class="sp-field">
        <label class="sp-label">${fieldMeta.label}</label>
        <textarea class="loyalty-input" rows="3" style="font-family: inherit; letter-spacing: 0; resize: vertical;"
                  ${app.editMode ? '' : 'disabled'}
                  oninput="setDocField('${catId}', ${attrJS(doc.id || '')}, '${fieldName}', this.value)">${value.replace(/</g, '&lt;')}</textarea>
      </div>
    `;
  }

  // Special expiry visual
  let expiryIndicator = "";
  if (fieldMeta.expiry && value && !app.editMode) {
    const status = docExpiryStatus(value);
    if (status === "expired") expiryIndicator = '<span class="doc-expiry-badge expired" style="margin-left: 6px;">Expired</span>';
    else if (status === "expiring") expiryIndicator = '<span class="doc-expiry-badge expiring" style="margin-left: 6px;">Expiring soon</span>';
  }

  return `
    <div class="sp-field">
      <label class="sp-label">${fieldMeta.label}${expiryIndicator}</label>
      <div class="${showMasked ? 'doc-masked-row' : ''}">
        <input type="${fieldMeta.type}" class="loyalty-input"
               style="${fieldMeta.mono ? 'font-family: ui-monospace, Menlo, monospace;' : 'font-family: inherit; letter-spacing: 0;'}"
               value="${displayValue.replace(/"/g, '&quot;')}"
               ${app.editMode ? '' : 'disabled'}
               oninput="setDocField('${catId}', ${attrJS(doc.id || '')}, '${fieldName}', this.value)">
        ${showMasked ? `<span class="loyalty-reveal" onclick="revealDocField(${attrJS(revealKey)})">Show</span>` : ''}
      </div>
    </div>
  `;
}

// Tracks which document fields are temporarily revealed
const revealedFields = new Set();
function revealDocField(key) {
  revealedFields.add(key);
  setTimeout(() => {
    revealedFields.delete(key);
    if (app.screen === "settings" && app.settingsPage === "documents") render();
  }, 30000);
  render();
}

/* ===== PHOTO HANDLING ===== */

function renderPhotoSection(catId, doc) {
  const photoData = doc.photoData;
  return `
    <div class="sp-section">
      <div class="sp-section-title">Photo / scan</div>
      <div class="sp-hint">Stored locally and never shared. Use this for quick reference when you need to show your document.</div>
      ${photoData ? `
        <div class="doc-photo-wrap">
          <img src="${photoData}" class="doc-photo-thumb ${userSettings.maskSensitive && !app.editMode ? 'masked' : ''}"
               onclick="openDocPhoto(${attrJS(catId)}, ${attrJS(doc.id || '')})" alt="Document scan">
          ${userSettings.maskSensitive && !app.editMode ? `<div class="doc-photo-overlay" onclick="openDocPhoto(${attrJS(catId)}, ${attrJS(doc.id || '')})">Tap to view</div>` : ''}
          ${app.editMode ? `<span class="btn btn-small" onclick="removeDocPhoto('${catId}', ${attrJS(doc.id || '')})" style="margin-top: 8px;">Remove photo</span>` : ''}
        </div>
      ` : `
        ${app.editMode ? `
          <label class="doc-photo-add">
            <input type="file" accept="image/*" capture="environment" style="display: none;"
                   onchange="uploadDocPhoto(event, '${catId}', ${attrJS(doc.id || '')})">
            <span class="doc-photo-add-icon">📷</span>
            <span class="doc-photo-add-text">Add photo</span>
            <span class="doc-photo-add-sub">Take a photo or upload from your device</span>
          </label>
        ` : `<div class="docs-empty-text">No photo attached.</div>`}
      `}
    </div>
  `;
}

function uploadDocPhoto(event, catId, docId) {
  if (!app.editMode) return;
  const file = event.target.files?.[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) {
    showToast("Image too large — max 5 MB");
    return;
  }
  const reader = new FileReader();
  reader.onload = (e) => {
    const dataUrl = e.target.result;
    const meta = docCategoryMeta(catId);
    if (meta.multi) {
      const list = app.draft.documents[catId] || [];
      const doc = list.find(d => d.id === docId);
      if (doc) doc.photoData = dataUrl;
    } else {
      if (!app.draft.documents[catId]) app.draft.documents[catId] = {};
      app.draft.documents[catId].photoData = dataUrl;
    }
    render();
  };
  reader.readAsDataURL(file);
}

function removeDocPhoto(catId, docId) {
  if (!app.editMode) return;
  const meta = docCategoryMeta(catId);
  if (meta.multi) {
    const list = app.draft.documents[catId] || [];
    const doc = list.find(d => d.id === docId);
    if (doc) doc.photoData = null;
  } else {
    if (app.draft.documents[catId]) app.draft.documents[catId].photoData = null;
  }
  render();
}

function openDocPhoto(catId, docId) {
  const data = userSettings.documents[catId];
  let photoData = null;
  if (Array.isArray(data)) {
    const doc = data.find(d => d.id === docId);
    photoData = doc?.photoData;
  } else if (data && typeof data === "object") {
    photoData = data.photoData;
  }

function setDocField(catId, docId, fieldName, value) {
  if (!app.editMode) return;
  const meta = docCategoryMeta(catId);
  if (meta.multi) {
    const list = app.draft.documents[catId] || [];
    const doc = list.find(d => d.id === docId);
    if (doc) doc[fieldName] = value;
  } else {
    if (!app.draft.documents[catId]) app.draft.documents[catId] = {};
    app.draft.documents[catId][fieldName] = value;
  }
}

function toggleDocField(catId, docId, fieldName) {
  if (!app.editMode) return;
  const meta = docCategoryMeta(catId);
  if (meta.multi) {
    const list = app.draft.documents[catId] || [];
    const doc = list.find(d => d.id === docId);
    if (doc) doc[fieldName] = !doc[fieldName];
  } else {
    if (!app.draft.documents[catId]) app.draft.documents[catId] = {};
    app.draft.documents[catId][fieldName] = !app.draft.documents[catId][fieldName];
  }
  render();
}

function addDocument(catId) {
  if (!app.editMode) {
    // Auto-enter edit mode for adding
    startEdit();
  }
  if (!app.draft.documents[catId]) app.draft.documents[catId] = [];
  const newDoc = { id: "d-" + Date.now() };
  // Initialize fields based on category
  const meta = docCategoryMeta(catId);
  meta.fields.forEach(f => {
    if (f === "doses") newDoc[f] = [];
    else newDoc[f] = "";
  });
  newDoc.photoData = null;
  app.draft.documents[catId].push(newDoc);
  app.documentId = newDoc.id;
  render();
}

function deleteDocument(catId, docId) {
  if (!app.editMode) return;
  const list = app.draft.documents[catId] || [];
  app.draft.documents[catId] = list.filter(d => d.id !== docId);
  app.documentId = null;
  showToast("Document removed (save to confirm)");
  render();
}

// Tracks which loyalty numbers are currently revealed (only matters when masking is on)
const revealedLoyalty = new Set();

// Render the membership-number input list for currently-selected loyalty programs
// Render loyalty number inputs for a given category ("travel" or "lodging")
// Only shows programs that belong to that category AND are currently selected.
function renderLoyaltyNumbers(category) {
  const catalogKey = category === "lodging" ? "lodgingLoyalty" : "travelLoyalty";
  const categoryPrograms = CATALOG[catalogKey];
  const selected = effective("loyalty");
  const numbers = effective("loyaltyNumbers") || {};
  // Filter to only the programs in this category that are also selected
  const list = categoryPrograms.filter(p => selected.has(p));
  const masking = userSettings.maskSensitive && !app.editMode; // never mask while editing
  if (list.length === 0) {
    return `<div class="loyalty-empty">Select a program above to add your membership number.</div>`;
  }
  const rows = list.map(program => {
    const num = numbers[program] || "";
    const isRevealed = revealedLoyalty.has(program);
    const showMasked = masking && num && !isRevealed;
    const displayValue = showMasked ? "•".repeat(Math.max(num.length, 6)) : num;

    if (showMasked) {
      return `
        <div class="loyalty-row">
          <label class="loyalty-label">${program}</label>
          <div class="loyalty-masked">
            <span class="loyalty-masked-value">${displayValue}</span>
            <span class="loyalty-reveal" onclick="revealLoyalty(${attrJS(program)})">Show</span>
          </div>
        </div>
      `;
    }

    return `
      <div class="loyalty-row">
        <label class="loyalty-label">${program}</label>
        <input type="text" class="loyalty-input"
               value="${displayValue.replace(/"/g, '&quot;')}"
               placeholder="Membership number"
               ${app.editMode ? '' : 'disabled'}
               oninput="setLoyaltyNumber(${attrJS(program)}, this.value)">
      </div>
    `;
  }).join("");
  return `<div class="loyalty-numbers">${rows}</div>`;
}

function revealLoyalty(program) {
  revealedLoyalty.add(program);
  // Auto-hide after 30 seconds for safety
  setTimeout(() => {
    revealedLoyalty.delete(program);
    if (app.screen === "settings" && app.settingsPage === "travel") render();
  }, 30000);
  render();
}

function setLoyaltyNumber(program, value) {
  if (!app.editMode) return;
  if (!app.draft.loyaltyNumbers) app.draft.loyaltyNumbers = {};
  if (value.trim()) {
    app.draft.loyaltyNumbers[program] = value;
  } else {
    delete app.draft.loyaltyNumbers[program];
  }
}

function toggleTag(group, tag) {
  // Only mutate state when in edit mode
  if (!app.editMode) return;
  const target = app.draft[group];
  if (SINGLE_SELECT.has(group)) {
    app.draft[group] = tag;
  } else {
    if (target.has(tag)) {
      target.delete(tag);
      // If deselecting a loyalty program, drop its stored membership number too
      if (group === "loyalty" && app.draft.loyaltyNumbers) {
        delete app.draft.loyaltyNumbers[tag];
      }
    } else {
      target.add(tag);
    }
  }
  render();
}

function renderChipGroup(group) {
  const selected = effective(group);
  const isSingle = SINGLE_SELECT.has(group);
  const disabled = !app.editMode;
  return CATALOG[group].map(opt => {
    const active = isSingle ? selected === opt : selected.has(opt);
    return `<span class="nt-chip ${active ? 'active' : ''} ${disabled ? 'readonly' : ''}" onclick="toggleTag('${group}', ${attrJS(opt)})">${opt}</span>`;
  }).join("");
}

// Render a chip group using a category-specific loyalty catalog (travelLoyalty or lodgingLoyalty),

// ----- NEW TRIP -----
// Convert an existing trip into the new-trip dialog's state shape, so the dialog
// can be reused for editing. Stays and travelers come from the trip; preferences
// fall back to current Settings if the trip didn't store its own snapshot.
function buildEditState(t) {
  // Find primary traveler (must be present per the data model rule)
  const primary = t.travelers.find(tr => tr.primary) || t.travelers[0] || { name: "" };
  const companions = t.travelers
    .filter(tr => tr !== primary)
    .map((tr, idx) => ({ id: idx + 1, name: tr.name }));

  // Stays: keep the existing list (multiple cities supported; first stay was used as
  // stayCity in the simple new-trip flow, so we preserve all of them)
  let stays = (t.stays || []).map(s => ({
    id: s.id || ("st-" + Math.random().toString(36).slice(2, 8)),
    city: s.city,
    checkIn: s.checkIn,
    checkOut: s.checkOut
  }));
  // Always have at least one stay row in the editor (so the user has something to fill in)
  if (stays.length === 0) {
    stays = [{ id: "ns-" + Date.now(), city: "", checkIn: "", checkOut: "" }];
  }

  // Use the trip's preference snapshot if it has one; otherwise fall back to current Settings
  const prefs = t.preferences || {};

  return {
    name: t.name || "",
    primaryName: primary.name,
    companions,
    origin: t.origin,
    originDate: t.originDate,
    // Keep first stay's city in the legacy stayCity field for back-compat with the simple form
    stayCity: stays[0]?.city || (t.cities && t.cities[0]) || "",
    // Full editable list of stays for multi-city support
    stays,
    returnCity: t.returnCity || t.origin,
    returnCityManuallyEdited: !!(t.returnCity && t.returnCity !== t.origin),
    returnDate: t.returnDate,
    outboundLeg: { mode: "Flight", serviceClass: prefs.flightClass || userSettings.flightClass, arrivesNextDay: false },
    returnLeg: { mode: "Flight", serviceClass: prefs.flightClass || userSettings.flightClass, arrivesNextDay: false },
    cuisines: new Set(prefs.cuisines || [...userSettings.cuisines]),
    sights: new Set(prefs.sights || [...userSettings.sights]),
    lodging: new Set(prefs.lodging || [...userSettings.lodging]),
    flightClass: prefs.flightClass || userSettings.flightClass,
    snapshot: {
      origin: t.origin,
      cuisines: new Set(prefs.cuisines || [...userSettings.cuisines]),
      sights: new Set(prefs.sights || [...userSettings.sights]),
      lodging: new Set(prefs.lodging || [...userSettings.lodging]),
      flightClass: prefs.flightClass || userSettings.flightClass
    },
    // Editing-specific:
    editingTripId: t.id
  };
}

function openNewTrip(existingTrip) {
  const isEdit = !!existingTrip;

  // Pre-fill state — from existing trip if editing, or from Settings defaults if creating
  const state = isEdit ? buildEditState(existingTrip) : {
    name: "",
    primaryName: user.name,
    companions: [],
    origin: user.homeCity,
    originDate: "",
    stayCity: "",                        // legacy single-stay field (kept for save back-compat)
    stays: [{ id: "ns-" + Date.now(), city: "", checkIn: "", checkOut: "" }],
    returnCity: user.homeCity,           // defaults to origin; editable
    returnCityManuallyEdited: false,     // tracks whether the user has overridden the auto-sync
    returnDate: "",
    // Two legs: outbound (origin → stay) and return (stay → home)
    outboundLeg: { mode: "Flight", serviceClass: userSettings.flightClass, arrivesNextDay: false },
    returnLeg: { mode: "Flight", serviceClass: userSettings.flightClass, arrivesNextDay: false },
    // Preference snapshots (copied from Settings; editable in-dialog)
    cuisines: new Set(userSettings.cuisines),
    sights: new Set(userSettings.sights),
    lodging: new Set(userSettings.lodging),
    flightClass: userSettings.flightClass,
    // Frozen snapshot of what Settings held at open — used to detect overrides
    snapshot: {
      origin: user.homeCity,
      cuisines: new Set(userSettings.cuisines),
      sights: new Set(userSettings.sights),
      lodging: new Set(userSettings.lodging),
      flightClass: userSettings.flightClass
    }
  };
  let nextCompanionId = isEdit ? (state.companions.length + 1) : 1;

  function isValid() {
    return state.primaryName.trim() && state.origin.trim() && state.originDate && state.returnDate
      && getDateIssues().length === 0;
  }

  // Returns an array of issue messages for any date inconsistencies in state.
  // An empty array means dates are fine.
  function getDateIssues() {
    const issues = [];
    const dep = state.originDate;
    const ret = state.returnDate;

    if (dep && ret && ret < dep) {
      issues.push("Return date is before departure");
    }

    state.stays.forEach((s, i) => {
      if (!s.city || !s.city.trim()) return; // skip empty rows
      const inD = s.checkIn;
      const outD = s.checkOut;
      const num = i + 1;

      if (inD && dep && inD < dep) {
        issues.push(`Stay ${num} (${s.city}) check-in is before departure`);
      }
      if (outD && ret && outD > ret) {
        issues.push(`Stay ${num} (${s.city}) check-out is after return`);
      }
      if (inD && outD && outD < inD) {
        issues.push(`Stay ${num} (${s.city}) checks out before checking in`);
      }
      // Overlap with previous stay (warning, not block — treat as issue for clarity)
      if (i > 0 && inD) {
        const prev = state.stays[i - 1];
        if (prev.checkOut && inD < prev.checkOut) {
          issues.push(`Stay ${num} (${s.city}) check-in overlaps with previous stay`);
        }
      }
    });

    return issues;
  }

  function setsEqual(a, b) {
    if (a.size !== b.size) return false;
    for (const x of a) if (!b.has(x)) return false;
    return true;
  }

  // Service class options vary by mode
  function classOptions(mode, selected) {
    let opts;
    if (mode === "Flight") opts = ["Economy", "Premium economy", "Business", "First class"];
    else if (mode === "Train") opts = ["Standard", "Standard Premier / Comfort", "First class", "Business Premier"];
    else if (mode === "Cruise") opts = ["Interior", "Ocean view", "Balcony", "Suite"];
    else if (mode === "Rental Car") opts = ["Economy", "Compact", "Mid-size", "SUV", "Luxury", "Convertible"];
    else opts = ["Standard", "Premium"]; // Car (own), Bus
    return opts.map(c => `<option ${selected === c ? 'selected' : ''}>${c}</option>`).join("");
  }

  function badgeFor(field) {
    // Returns "from Settings" or "overridden"
    const snap = state.snapshot;
    let matches = true;
    if (field === "cuisines") matches = setsEqual(state.cuisines, snap.cuisines);
    else if (field === "sights") matches = setsEqual(state.sights, snap.sights);
    else if (field === "lodging") matches = setsEqual(state.lodging, snap.lodging);
    else if (field === "flightClass") matches = state.flightClass === snap.flightClass;
    else if (field === "origin") matches = state.origin === snap.origin;
    return matches
      ? '<span class="nt-source-badge">from Settings</span>'
      : '<span class="nt-source-badge overridden">overridden</span>';
  }

  function chipRowFor(field, options) {
    return options.map(opt => {
      const active = state[field].has(opt);

      return `<span class="nt-chip ${active ? 'active' : ''} ${fromSettings ? 'from-settings' : ''}"
                    onclick="toggleNtChip(event, '${field}', ${attrJS(opt)})">${opt}</span>`;
    }).join("");
  }

  // Expose toggle handler on window so inline onclick can reach it

    e.stopPropagation();
    if (state[field].has(opt)) state[field].delete(opt);

          <div class="nt-section">

            <div class="nt-field">
              <label class="nt-label">Flight class ${badgeFor("flightClass")}</label>
              <select id="nt-flight-class" class="nt-select">

        </div>
        ${(() => {
          const issues = getDateIssues();
          if (issues.length === 0) return "";
          return `
            <div class="nt-issues">

    // Wire inputs

    const originDateInp = document.getElementById("nt-origin-date");

      state.originDate = e.target.value;

    originDateInp.oninput = originDateHandler;
    originDateInp.onchange = originDateHandler;

    // Wire up each stay's city/dates inputs (multi-stay supported)
    document.querySelectorAll(".nt-stay-city-input").forEach(inp => {

        }
      };
    });
    document.querySelectorAll(".nt-stay-checkin-input").forEach(inp => {
      const handler = (e) => {
        const stay = state.stays.find(s => s.id === inp.dataset.stayId);
        if (stay) stay.checkIn = e.target.value;
        cascadeDates("stayCheckIn");
        updateAfterDateChange();
      };
      inp.oninput = handler;
      inp.onchange = handler;
    });
    document.querySelectorAll(".nt-stay-checkout-input").forEach(inp => {
      const handler = (e) => {
        const stay = state.stays.find(s => s.id === inp.dataset.stayId);
        if (stay) stay.checkOut = e.target.value;
        cascadeDates("stayCheckOut");
        updateAfterDateChange();
      };
      inp.oninput = handler;
      inp.onchange = handler;
    });

    // "+ Add another city" — append a new empty stay and re-render the dialog
    const addStayBtn = document.getElementById("nt-add-stay-btn");
    if (addStayBtn) {
      addStayBtn.onclick = () => {
        if (state.stays.length >= 6) {
          showToast("Up to 6 cities per trip");
          return;
        }
        // New stay's check-in defaults to the previous stay's check-out (or origin date)
        const prev = state.stays[state.stays.length - 1];
        const newCheckIn = (prev && prev.checkOut) ? prev.checkOut : state.originDate;
        state.stays.push({
          id: "ns-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6),
          city: "",
          checkIn: newCheckIn,
          checkOut: ""
        });
        cascadeDates("addStay");
        renderNewTrip();
      };
    }

    // Remove a stay (only shown when more than one stay exists)
    document.querySelectorAll("[data-remove-stay]").forEach(btn => {
      btn.onclick = () => {
        const id = btn.dataset.removeStay;
        state.stays = state.stays.filter(s => s.id !== id);
        // Resync stayCity to first stay
        state.stayCity = state.stays[0]?.city || "";
        renderNewTrip();
      };
    });

    // Return city: editable, with auto-sync from origin until manually overridden
    document.getElementById("nt-return-city").oninput = (e) => {
      const v = e.target.value;
      if (v.trim() === "") {
        // Cleared: revert to auto-sync from origin
        state.returnCity = state.origin;
        state.returnCityManuallyEdited = false;
      } else {
        state.returnCity = v;
        // Mark as manually edited only if the user typed something different from origin
        state.returnCityManuallyEdited = v !== state.origin;
      }
    };

    const returnDateInp = document.getElementById("nt-return-date");
    const returnDateHandler = (e) => {
      state.returnDate = e.target.value;
      cascadeDates("returnDate");
      updateAfterDateChange();
    };
    returnDateInp.oninput = returnDateHandler;
    returnDateInp.onchange = returnDateHandler;
    document.getElementById("nt-flight-class").onchange = (e) => {
      state.flightClass = e.target.value;
      renderNewTrip();
    };

    function updateCreateBtn() {
      document.getElementById("nt-create").classList.toggle("disabled", !isValid());
    }

    // Called when a date changes — re-renders so the issues banner updates live
    function updateAfterDateChange() {
      renderNewTrip();
    }

    // Cascade rule: dates flow through the trip in order.
    // Origin date → Stay 1 check-in → Stay 1 check-out → Stay 2 check-in → ... → last check-out → Return date.
    // Auto-fill any blank field, OR fill a field that still matches its previous default.
    // Manual overrides (the user explicitly set a different value) are preserved.
    // Overnight legs (outbound or return) add +1 day to bridge the date boundary for international travel.
    function cascadeDates(changedKey) {
      const stays = state.stays;

      // Helper: add N days to a YYYY-MM-DD string
      const addDays = (dateStr, n) => {
        if (!dateStr) return dateStr;
        const d = new Date(dateStr + "T00:00:00");
        d.setDate(d.getDate() + n);
        return toLocalDateStr(d);
      };

      // Walk stays in order. For each stay:
      //   1. Fill check-in from prior step (origin date for first stay, previous stay's check-out for others)
      //   2. Fill check-out as check-in + 3 days if blank
      //   This way each stage's defaults flow forward, so later pickers land on sensible dates.
      for (let i = 0; i < stays.length; i++) {
        const cur = stays[i];

        // Step 1 — fill check-in
        if (i === 0) {
          // First stay's check-in flows from origin (with overnight bump)
          if (state.originDate) {
            const expected = state.outboundLeg.arrivesNextDay ? addDays(state.originDate, 1) : state.originDate;
            if (!cur.checkIn || cur.checkIn === state._prevExpectedFirstCheckIn) {
              cur.checkIn = expected;
            }
          }
        } else {
          // Subsequent stays — check-in from prior stay's check-out
          const prev = stays[i - 1];
          if (prev.checkOut) {
            if (!cur.checkIn || cur.checkIn === prev._prevCheckOut) {
              cur.checkIn = prev.checkOut;
            }
          }
        }

        // Step 2 — fill check-out if blank, defaulting to check-in + 3 days
        if (cur.checkIn && !cur.checkOut) {
          cur.checkOut = addDays(cur.checkIn, 3);
        }
      }

      // Last stay's check-out → Return date
      const last = stays[stays.length - 1];
      if (last && last.checkOut) {
        if (!state.returnDate || state.returnDate === state._prevLastCheckOut) {
          state.returnDate = last.checkOut;
        }
      }
      // If return date was set first, propagate it BACKWARDS to last stay's check-out (only if blank)
      if (last && state.returnDate && !last.checkOut) {
        last.checkOut = state.returnDate;
      }

      // Snapshot current values so we can detect future user-overrides
      state._prevOriginDate = state.originDate;
      state._prevExpectedFirstCheckIn = stays[0]
        ? (state.outboundLeg.arrivesNextDay ? addDays(state.originDate, 1) : state.originDate)
        : "";
      state._prevLastCheckOut = last ? last.checkOut : "";
      stays.forEach(s => { s._prevCheckOut = s.checkOut; });
    }

    document.querySelectorAll('input[data-companion-id]').forEach(inp => {
      inp.oninput = () => {
        const c = state.companions.find(x => x.id === +inp.dataset.companionId);
        if (c) c.name = inp.value;
      };
    });
    document.querySelectorAll('[data-remove]').forEach(btn => {
      btn.onclick = () => {
        state.companions = state.companions.filter(c => c.id !== +btn.dataset.remove);
        renderNewTrip();
      };
    });
    document.getElementById("nt-add-companion").onclick = () => {
      state.companions.push({ id: nextCompanionId++, name: "" });
      renderNewTrip();
    };

    // Transit leg selects
    document.querySelectorAll('select[data-leg]').forEach(sel => {
      sel.onchange = () => {
        const leg = sel.dataset.leg === "outbound" ? state.outboundLeg : state.returnLeg;
        leg[sel.dataset.field] = sel.value;
        // If mode changed, service class options change too — re-render
        if (sel.dataset.field === "mode") {
          // Reset to a valid default for the new mode
          // Reset to a sensible default for the new mode
          if (sel.value === "Flight") leg.serviceClass = userSettings.flightClass;
          else if (sel.value === "Train") leg.serviceClass = userSettings.trainClass;
          else if (sel.value === "Rental Car") leg.serviceClass = "Mid-size";
          else leg.serviceClass = "Standard";
          renderNewTrip();
        }
      };
    });

    // Overnight checkbox handlers (international / red-eye legs)
    document.querySelectorAll('input[type="checkbox"][data-leg]').forEach(box => {
      box.onchange = () => {
        const leg = box.dataset.leg === "outbound" ? state.outboundLeg : state.returnLeg;
        leg.arrivesNextDay = box.checked;
        cascadeDates("legOvernight");
        renderNewTrip();
      };
    });

    document.getElementById("nt-create").onclick = () => {
      if (!isValid()) {
        primaryInput.focus();
        return;
      }

      // Build the updated/new trip data from the dialog state
      const travelersList = [
        { id: 1, name: state.primaryName, primary: true },
        ...state.companions.filter(c => c.name.trim()).map((c, i) => ({ id: i + 2, name: c.name, primary: false }))
      ];

      // Build stays from the dialog state — only stays with a city name make it into the trip
      const validStays = state.stays
        .filter(s => s.city && s.city.trim())
        .map((s, i) => ({
          id: s.id || ("ns" + (i + 1)),
          city: s.city.trim(),
          // Default dates if missing: stay 0 = origin date, others = empty for now
          checkIn: s.checkIn || (i === 0 ? state.originDate : ""),
          checkOut: s.checkOut || (i === state.stays.length - 1 ? state.returnDate : "")
        }));

      if (isEdit) {
        // EDIT: update the existing trip in place, preserving dayItems and original status
        const idx = trips.findIndex(t => t.id === state.editingTripId);
        if (idx === -1) return;
        const existing = trips[idx];

        trips[idx] = {
          ...existing,
          name: state.name || existing.name,
          cities: validStays.map(s => s.city),
          origin: state.origin,
          returnCity: state.returnCity || state.origin,
          originDate: state.originDate,
          returnDate: state.returnDate,
          travelers: travelersList,
          stays: validStays,
          // dayItems is preserved from existing — important: planned items survive an edit
          // preferences are preserved as the original snapshot (the immutability rule)
        };
        closeModal();
        showToast("Trip updated");
        persist();
        render();
        return;
      }

      // CREATE: brand new trip
      const newTrip = {
        id: "trip-new-" + Date.now(),
        name: state.name || "New trip",
        cities: validStays.map(s => s.city),
        origin: state.origin,
        returnCity: state.returnCity || state.origin,
        originDate: state.originDate,
        returnDate: state.returnDate,
        status: "planning",
        travelers: travelersList,
        stays: validStays,
        dayItems: {},
        // Snapshot of preferences at creation time (the immutability rule)
        preferences: {
          cuisines: [...state.cuisines],
          sights: [...state.sights],
          lodging: [...state.lodging],
          flightClass: state.flightClass
        }
      };
      trips.unshift(newTrip);
      closeModal();
      showToast("Trip created");
      persist();
      render();
    };
  }

  // Seed the snapshot tracking so the cascade can detect manual overrides going forward
  state._prevOriginDate = state.originDate;
  state._prevLastCheckOut = state.stays.length ? state.stays[state.stays.length - 1].checkOut : "";
  // Compute the expected first check-in (origin + 1 day if overnight)
  const _addDaysSeed = (dateStr, n) => {
    if (!dateStr) return dateStr;
    const d = new Date(dateStr + "T00:00:00");
    d.setDate(d.getDate() + n);
    return toLocalDateStr(d);
  };
  state._prevExpectedFirstCheckIn = state.stays[0]
    ? (state.outboundLeg.arrivesNextDay ? _addDaysSeed(state.originDate, 1) : state.originDate)
    : "";
  state.stays.forEach(s => { s._prevCheckOut = s.checkOut; });

  renderNewTrip();
}

function saveCustomTransport(legId, state) {
  if (!state.operator.trim() || !state.date) {
    showToast("Operator and date are required");
    return;
  }
  const t = currentTrip();
  const slot = ensureTransportSlot(t, legId);
  if (!slot.customOptions) slot.customOptions = [];

  const customId = "tcustom-" + Date.now();
  // Build a result-shaped object that the unified results list can render
  // The arrTime gets a "+1" marker if arrivesNextDay is checked, mirroring the catalog format
  const arrTimeDisplay = state.arrTime ? (state.arrivesNextDay ? `${state.arrTime} +1` : state.arrTime) : "";
  // Compute durationMin if we have both times
  let durationMin = 0;
  if (state.depTime && state.arrTime) {
    const [dh, dm] = state.depTime.split(":").map(Number);
    const [ah, am] = state.arrTime.split(":").map(Number);
    durationMin = (ah * 60 + am) - (dh * 60 + dm);
    if (state.arrivesNextDay || durationMin < 0) durationMin += 24 * 60;
  }
  slot.customOptions.push({
    id: customId,
    airline: state.operator.trim(),
    flightNum: state.flightNum.trim(),
    date: state.date,
    depTime: state.depTime,
    arrTime: arrTimeDisplay,
    durationMin: durationMin,
    stops: state.stops,
    price: parseFloat(state.price) || 0,
    website: state.website.trim() || null,
    notes: state.notes.trim(),
    isCustom: true
  });
  closeModal();
  showToast(`Added "${state.operator}"`);
  persist();
  render();
}

function deleteCustomPlace(placeId) {
  if (!confirm("Delete this place from your saved suggestions?")) return;
  userSettings.customPlaces = (userSettings.customPlaces || []).filter(p => p.id !== placeId);
  // Also remove it from any trip's dayItems so we don't have orphan references
  for (const t of trips) {
    for (const date in t.dayItems) {
      t.dayItems[date] = t.dayItems[date].filter(i => i.placeId !== placeId);
      if (!t.dayItems[date].length) delete t.dayItems[date];
    }
  }
  closeModal();
  showToast("Place removed");
  persist();
  render();
}

function findPlace(placeId) {
  // Check curated catalog first
  for (const city of Object.values(PLACES)) {
    for (const cat of Object.values(city)) {
      const found = cat.find(p => p.id === placeId);
      if (found) return found;
    }
  }
  // Then check user's custom places
  const custom = (userSettings.customPlaces || []).find(p => p.id === placeId);
  if (custom) return custom;
  return null;
}

function showDayPicker(placeId) {
  const menu = document.getElementById("day-menu");
  if (!menu) return;
  const t = currentTrip();
  const p = findPlace(placeId);
  const fmtDate = (d) => new Date(d + "T00:00:00").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
  const getDates = () => {
    const dates = []; let d = new Date(t.originDate + "T00:00:00"); const end = new Date(t.returnDate + "T00:00:00");
    while (d <= end) { dates.push(toLocalDateStr(d)); d.setDate(d.getDate() + 1); }
    return dates;
  };
  const dates = getDates();
  const cityForDate = (date) => {
    const stay = t.stays.find(s => date >= s.checkIn && date < s.checkOut);
    if (stay) return stay.city;
    return null;
  };
  menu.innerHTML = dates.map(date => {
    const dayCity = cityForDate(date);
    // city-matching: the place belongs to one of our known cities
    let mismatch = false;
    if (dayCity) {
      // Look up which city this place belongs to
      for (const [cityName, cats] of Object.entries(PLACES)) {
        if (Object.values(cats).some(catArr => catArr.find(x => x.id === p.id))) {
          if (cityName !== dayCity) mismatch = true;
          break;
        }
      }
    }
    return `
      <div class="day-menu-item ${mismatch ? 'mismatch' : ''}" onclick="addToDay('${placeId}', '${date}', ${mismatch})">
        <span>${fmtDate(date)}${dayCity ? ` <span style="color:var(--text-tertiary)">· ${dayCity}</span>` : ''}</span>
        ${mismatch ? '<span style="font-size:10px; color:var(--text-danger);">Different city</span>' : ''}
      </div>
    `;
  }).join("");
  menu.classList.add("active");
  // Close on outside click
  setTimeout(() => {
    const handler = (e) => {
      if (!menu.contains(e.target)) {
        menu.classList.remove("active");
        document.removeEventListener("click", handler);
      }
    };
    document.addEventListener("click", handler);
  }, 10);
}

function addToDay(placeId, date, isMismatch) {
  if (isMismatch && !confirm("This place is in a different city than this day. Add anyway?")) {
    document.getElementById("day-menu")?.classList.remove("active");
    return;
  }
  const t = currentTrip();
  const p = findPlace(placeId);
  if (!p) return;
  if (!t.dayItems[date]) t.dayItems[date] = [];
  // No duplicates
  if (t.dayItems[date].some(i => i.placeId === placeId)) {
    showToast("Already added to this day");
    document.getElementById("day-menu")?.classList.remove("active");
    return;
  }
  t.dayItems[date].push({
    id: "di-" + Date.now(),
    category: p.cat,
    placeId: p.id,
    name: p.name,
    sub: p.meta,
    time: ""
  });
  document.getElementById("day-menu")?.classList.remove("active");
  closeModal();
  showToast("Added");
  persist();
  render();
}

/* ============================================================
   TOAST
   ============================================================ */

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove("show"), 1800);
}

/* ============================================================
   INIT
   ============================================================ */

loadFromStorage();
render();
</script>
